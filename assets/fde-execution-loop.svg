<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="100%" height="280" role="img" aria-label="AI Forward Deployed Engineering Flywheel Diagram">
  <defs>
    <linearGradient id="fdeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060914"/>
      <stop offset="50%" stop-color="#0b1224"/>
      <stop offset="100%" stop-color="#060913"/>
    </linearGradient>
    <linearGradient id="nodeFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111a30"/>
      <stop offset="100%" stop-color="#0a1020"/>
    </linearGradient>
    <marker id="fdeArrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="loopArrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#10b981"/>
    </marker>
  </defs>

  <!-- Outer Frame -->
  <rect x="2" y="2" width="1196" height="276" rx="18" fill="url(#fdeBg)" stroke="#1e293b" stroke-width="2"/>

  <!-- Title -->
  <g transform="translate(32, 22)">
    <rect x="0" y="0" width="215" height="26" rx="6" fill="#141838" stroke="#8b5cf6" stroke-opacity="0.6" stroke-width="1"/>
    <text x="12" y="17" fill="#c4b5fd" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11.5" font-weight="700">/fde-execution-flywheel</text>
    <text x="232" y="18" fill="#f8fafc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="700">AI Forward Deployed Engineering (FDE): Field Escalations → Global Productization</text>
  </g>

  <!-- Step Connectors -->
  <line x1="286" y1="138" x2="318" y2="138" stroke="#38bdf8" stroke-width="2.2" marker-end="url(#fdeArrow)"/>
  <line x1="578" y1="138" x2="610" y2="138" stroke="#38bdf8" stroke-width="2.2" marker-end="url(#fdeArrow)"/>
  <line x1="870" y1="138" x2="902" y2="138" stroke="#38bdf8" stroke-width="2.2" marker-end="url(#fdeArrow)"/>

  <!-- Step 1 -->
  <g transform="translate(32, 68)">
    <rect x="0" y="0" width="254" height="142" rx="12" fill="url(#nodeFill)" stroke="#00f0ff" stroke-opacity="0.55" stroke-width="1.5"/>
    <text x="16" y="26" fill="#00f0ff" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="700">01 // ENTERPRISE ESCALATIONS</text>
    <text x="16" y="50" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="700">50+ Global Enterprises</text>
    <text x="16" y="74" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">Partner directly with CISO &amp; SOC teams</text>
    <text x="16" y="92" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">on high-severity SIEM, EDR &amp; AI gaps.</text>
    <rect x="16" y="106" width="222" height="24" rx="6" fill="#092238"/>
    <text x="26" y="122" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10.5" font-weight="700">IMPACT: +20% Enterprise CSAT</text>
  </g>

  <!-- Step 2 -->
  <g transform="translate(324, 68)">
    <rect x="0" y="0" width="254" height="142" rx="12" fill="url(#nodeFill)" stroke="#8b5cf6" stroke-opacity="0.55" stroke-width="1.5"/>
    <text x="16" y="26" fill="#c4b5fd" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="700">02 // RAPID AGENTIC PROTOTYPING</text>
    <text x="16" y="50" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="700">MCP, NL2KQL &amp; ML Models</text>
    <text x="16" y="74" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">Build bespoke MCP servers, RAG grounding</text>
    <text x="16" y="92" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">&amp; anomaly models on live customer data.</text>
    <rect x="16" y="106" width="222" height="24" rx="6" fill="#1b1438"/>
    <text x="26" y="122" fill="#c4b5fd" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10.5" font-weight="700">SPEED: -60% Research Turnaround</text>
  </g>

  <!-- Step 3 -->
  <g transform="translate(616, 68)">
    <rect x="0" y="0" width="254" height="142" rx="12" fill="url(#nodeFill)" stroke="#f59e0b" stroke-opacity="0.55" stroke-width="1.5"/>
    <text x="16" y="26" fill="#fbbf24" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="700">03 // AI RED-TEAM HARDENING</text>
    <text x="16" y="50" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="700">Guardrails &amp; Safety Gates</text>
    <text x="16" y="74" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">Stress-test against prompt injection,</text>
    <text x="16" y="92" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">unsafe tool calls &amp; excessive agency.</text>
    <rect x="16" y="106" width="222" height="24" rx="6" fill="#2b1c0c"/>
    <text x="26" y="122" fill="#fbbf24" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10.5" font-weight="700">SAFETY: Evidence-Grade Verifiers</text>
  </g>

  <!-- Step 4 -->
  <g transform="translate(908, 68)">
    <rect x="0" y="0" width="260" height="142" rx="12" fill="url(#nodeFill)" stroke="#10b981" stroke-opacity="0.65" stroke-width="1.5"/>
    <text x="16" y="26" fill="#6ee7b7" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="700">04 // GLOBAL PRODUCTIZATION</text>
    <text x="16" y="50" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="700">Shipped at Planet Scale</text>
    <text x="16" y="74" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">Transfer R&amp;D into Sentinel, Defender XDR,</text>
    <text x="16" y="92" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">Security Copilot &amp; Project Perception.</text>
    <rect x="16" y="106" width="228" height="24" rx="6" fill="#092922"/>
    <text x="26" y="122" fill="#10b981" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10.5" font-weight="700">SCALE: 1,000+ Orgs · 100M+ Users</text>
  </g>

  <!-- Continuous Feedback Flywheel Return Arc -->
  <path d="M 1038 214 L 1038 246 Q 1038 256 1028 256 L 170 256 Q 160 256 160 246 L 160 216" fill="none" stroke="#10b981" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#loopArrow)"/>
  <rect x="405" y="241" width="390" height="24" rx="12" fill="#081f1c" stroke="#10b981" stroke-opacity="0.5" stroke-width="1"/>
  <text x="424" y="257" fill="#6ee7b7" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10.5" font-weight="700">CONTINUOUS TELEMETRY &amp; CUSTOMER FEEDBACK LOOP</text>
</svg>
